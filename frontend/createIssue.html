<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.js"></script>
    <script src="/auth.js"></script>
    <title>Create issue · Trella</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: #f4f6f9;
        font:
          16px Inter,
          Arial;
        color: #172b4d;
      }
      * {
        box-sizing: border-box;
      }
      .card {
        width: min(100%, 440px);
        background: #fff;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 8px 25px #172b4d1a;
      }
      .back {
        color: #0c66e4;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
      }
      .logo {
        display: block;
        height: 40px;
        margin: 20px auto;
      }
      h1 {
        font-size: 25px;
        margin: 0;
      }
      p {
        color: #5e6c84;
      }
      label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        margin: 16px 0 6px;
      }
      input,
      select,
      button {
        width: 100%;
        height: 46px;
        border-radius: 9px;
        font: inherit;
      }
      input,
      select {
        border: 1px solid #b6c2cf;
        padding: 0 12px;
      }
      button {
        border: 0;
        background: #0c66e4;
        color: #fff;
        font-weight: 700;
        margin-top: 20px;
        cursor: pointer;
      }
      button:disabled {
        background: #a5adba;
        cursor: not-allowed;
      }
      .message {
        display: none;
        padding: 11px;
        margin-top: 14px;
        border-radius: 8px;
      }
      .error {
        display: block;
        background: #ffebe6;
        color: #ae2a19;
      }
      .success {
        display: block;
        background: #dcfff1;
        color: #216e4e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <a id="back" class="back">← Back to issues</a
      ><img class="logo" src="/dhaniks-trella.svg" alt="Trella" />
      <h1>Create issue</h1>
      <p>Create a new task for your board.</p>
      <form id="form">
        <label for="title">Issue title</label><input id="title" /><label
          for="state"
          >Starting column</label
        ><select id="state">
          <option value="Up next">Up next</option>
          <option value="In progress">In progress</option>
          <option value="Done">Done</option></select
        ><button id="submit">Create issue</button>
        <div id="message" class="message" role="alert"></div>
      </form>
    </main>
    <script>
      const p = new URLSearchParams(location.search),
        boardId = p.get("boardId"),
        orgId = p.get("orgId"),
        boardTitle = p.get("boardTitle"),
        f = document.getElementById("form"),
        b = document.getElementById("submit"),
        m = document.getElementById("message");
      const issuePageUrl =
        "/issue?boardId=" +
        boardId +
        "&orgId=" +
        orgId +
        "&boardTitle=" +
        encodeURIComponent(boardTitle || "");
      back.href = issuePageUrl;
      function msg(x, t = "error") {
        m.textContent = x;
        m.className = "message " + t;
      }
      f.onsubmit = async (e) => {
        e.preventDefault();
        const issueTitle = title.value.trim(),
          status = state.value;
        if (!issueTitle) return msg("Enter an issue title.");
        b.disabled = true;
        b.textContent = "Creating issue…";
        try {
          await axios.post(
            "/issue",
            { issueTitle, boardId, status },
            { headers: { token: localStorage.getItem("token") } },
          );
          msg("Issue created successfully. Returning to the board…", "success");
          setTimeout(() => (location.href = issuePageUrl), 600);
        } catch (e) {
          msg(
            e.response?.data?.message ||
              "We could not create the issue. Please try again.",
          );
        } finally {
          b.disabled = false;
          b.textContent = "Create issue";
        }
      };
    </script>
  </body>
</html>
