<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.js"></script>
    <script src="/auth.js"></script>
    <title>Create board · Trella</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: #f4f6f9;
        font:
          16px Inter,
          Arial;
        color: #172b4d;
      }
      * {
        box-sizing: border-box;
      }
      .card {
        width: min(100%, 440px);
        background: #fff;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 8px 25px #172b4d1a;
      }
      .back {
        color: #0c66e4;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
      .logo {
        display: block;
        height: 40px;
        margin: 0 auto 24px;
      }
      h1 {
        font-size: 25px;
        margin: 18px 0 6px;
      }
      p {
        color: #5e6c84;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin: 16px 0 6px;
      }
      input,
      button {
        width: 100%;
        height: 46px;
        border-radius: 9px;
        font: inherit;
      }
      input {
        border: 1px solid #b6c2cf;
        padding: 0 12px;
      }
      input:focus {
        outline: 3px solid #4c9aff66;
        border-color: #0c66e4;
      }
      button {
        border: 0;
        background: #0c66e4;
        color: #fff;
        font-weight: 700;
        margin-top: 20px;
        cursor: pointer;
      }
      button:disabled {
        background: #a5adba;
        cursor: not-allowed;
      }
      .message {
        display: none;
        padding: 11px;
        margin-top: 14px;
        border-radius: 8px;
      }
      .error {
        display: block;
        background: #ffebe6;
        color: #ae2a19;
      }
      .success {
        display: block;
        background: #dcfff1;
        color: #216e4e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <a id="back" class="back">← Back to boards</a
      ><img class="logo" src="/dhaniks-trella.svg" alt="Trella" />
      <h1>Create a board</h1>
      <p>Give your work a clear home.</p>
      <form id="form">
        <label for="title">Board name</label><input id="title" /><button
          id="submit"
        >
          Create board
        </button>
        <div id="message" class="message" role="alert"></div>
      </form>
    </main>
    <script>
      const orgId = new URLSearchParams(location.search).get("orgId"),
        f = document.getElementById("form"),
        b = document.getElementById("submit"),
        m = document.getElementById("message");
      back.href = "/?orgId=" + orgId;
      function msg(x, t = "error") {
        m.textContent = x;
        m.className = "message " + t;
      }
      f.onsubmit = async (e) => {
        e.preventDefault();
        const boardTitle = title.value.trim();
        if (!boardTitle) return msg("Enter a board name.");
        b.disabled = true;
        b.textContent = "Creating board…";
        try {
          await axios.post(
            "/board",
            { orgId, boardTitle },
            { headers: { token: localStorage.getItem("token") } },
          );
          msg("Board created successfully. Returning to boards…", "success");
          setTimeout(() => (location.href = "/?orgId=" + orgId), 600);
        } catch (e) {
          msg(
            e.response?.data?.message ||
              "We could not create the board. Please try again.",
          );
        } finally {
          b.disabled = false;
          b.textContent = "Create board";
        }
      };
    </script>
  </body>
</html>
