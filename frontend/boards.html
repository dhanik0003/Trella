<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.js"></script>
    <script src="/auth.js"></script>
    <title>Boards · Trella</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f4f6f9;
        font:
          16px Inter,
          Arial;
        color: #172b4d;
      }

      nav {
        min-height: 72px;
        background: #fff;
        padding: 14px clamp(16px, 5vw, 54px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        box-shadow: 0 3px 15px #172b4d15;
      }

      .logo {
        height: 38px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: end;
      }

      .organisation-select {
        max-width: 220px;
        min-height: 40px;
        border: 1px solid #b6c2cf;
        border-radius: 8px;
        padding: 0 10px;
        background: #fff;
        color: #172b4d;
        font: inherit;
        cursor: pointer;
      }

      .organisation-select:focus {
        outline: 3px solid #4c9aff66;
        border-color: #0c66e4;
      }

      .button {
        border: 0;
        background: #0c66e4;
        color: #fff;
        border-radius: 8px;
        padding: 10px 13px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }

      .button:hover {
        background: #0055cc;
        color: white;
      }

      .secondary {
        background: #e9f2ff;
        color: #0c66e4;
      }

      .logout {
        background: #fff;
        color: #44546f;
        font-size: 14px;
      }

      .logout:hover {
        background: #f1f2f4;
        color: #44546f;
      }

      main {
        max-width: 1280px;
        margin: auto;
        padding: clamp(24px, 5vw, 54px);
      }

      h1 {
        margin: 0;
      }

      .hint {
        color: #5e6c84;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 20px;
      }

      .board {
        min-height: 170px;
        border: 0;
        border-radius: 14px;
        background: #fff;
        padding: 22px;
        text-align: left;
        font: 600 19px Inter;
        color: #172b4d;
        cursor: pointer;
        box-shadow: 0 4px 12px #172b4d18;
        transition: 0.18s;
      }

      .board:hover,
      .board:focus {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px #172b4d28;
        outline: 3px solid #4c9aff;
      }

      .state {
        grid-column: 1/-1;
        padding: 30px;
        text-align: center;
        background: #fff;
        color: #5e6c84;
        border-radius: 12px;
      }

      .skeleton {
        min-height: 170px;
        border-radius: 14px;
        background: linear-gradient(
          90deg,
          #e9edf2 25%,
          #f5f7f9 37%,
          #e9edf2 63%
        );
        background-size: 400% 100%;
        animation: loading-shimmer 1.3s ease infinite;
      }

      @keyframes loading-shimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }

      .error {
        background: #ffebe6;
        color: #ae2a19;
      }

      @media (max-width: 520px) {
        nav {
          align-items: flex-start;
        }

        .logo {
          height: 32px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .organisation-select {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <nav>
      <img src="/dhaniks-trella.svg" class="logo" alt="Trella" />
      <div class="actions">
        <label class="visually-hidden" for="organisationSelect"
          >Switch organisation</label
        >
        <select id="organisationSelect" class="organisation-select" disabled>
          <option>Loading organisations…</option>
        </select>
        <a id="members" class="button secondary">Members</a
        ><a id="create" class="button">+ Create board</a
        ><button
          class="button logout"
          onclick="
            localStorage.removeItem('token');
            location.href = '/signin';
          "
        >
          Log out
        </button>
      </div>
    </nav>
    <main>
      <h1 id="boardsHeading">Your boards</h1>
      <p class="hint">Choose a board to view its issues.</p>
      <section id="list" class="grid" aria-live="polite">
        <div class="skeleton" aria-label="Loading boards"></div>
        <div class="skeleton" aria-hidden="true"></div>
        <div class="skeleton" aria-hidden="true"></div>
      </section>
    </main>
    <script>
      const orgId = new URLSearchParams(location.search).get("orgId");
      const list = document.getElementById("list");
      const membersLink = document.getElementById("members");
      const createLink = document.getElementById("create");
      const organisationSelect = document.getElementById("organisationSelect");
      membersLink.href = "/addtoorg?orgId=" + orgId;
      createLink.href = "/createboard?orgId=" + orgId;

      async function loadOrganisationSelector() {
        try {
          const response = await axios.get("/organisations", {
            headers: { token: localStorage.getItem("token") },
          });
          const organisations = response.data.organisations || [];
          organisationSelect.replaceChildren();

          if (!organisations.length) {
            const option = new Option("No organisations available", "");
            organisationSelect.appendChild(option);
            return;
          }

          organisations.forEach((organisation) => {
            const option = new Option(organisation.name, organisation._id);
            option.selected = organisation._id === orgId;
            organisationSelect.appendChild(option);
            if (organisation._id === orgId) {
              document.getElementById("boardsHeading").textContent =
                organisation.name;
              document.title = `${organisation.name} · Trella`;
            }
          });
          organisationSelect.disabled = false;
          organisationSelect.onchange = () => {
            if (
              organisationSelect.value &&
              organisationSelect.value !== orgId
            ) {
              location.href = "/?orgId=" + organisationSelect.value;
            }
          };
        } catch (error) {
          organisationSelect.replaceChildren(
            new Option("Organisation switcher unavailable", ""),
          );
        }
      }
      async function load() {
        list.innerHTML =
          '<div class="skeleton" aria-label="Loading boards"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>';
        if (!orgId) {
          list.innerHTML =
            '<div class="state error">No organisation is selected.</div>';
          return;
        }
        try {
          const r = await axios.get("/boards", {
              params: { orgId },
              headers: { token: localStorage.getItem("token") },
            }),
            boards = r.data.organisationBoards || [];
          if (!boards.length) {
            list.innerHTML =
              '<div class="state"><strong>No boards yet.</strong><br>Create your first board to start organising work.</div>';
            return;
          }
          list.replaceChildren();
          boards.forEach((x) => {
            const b = document.createElement("button");
            b.className = "board";
            b.textContent = x.title;
            b.onclick = () =>
              (location.href =
                "/issue?boardId=" +
                x._id +
                "&orgId=" +
                orgId +
                "&boardTitle=" +
                encodeURIComponent(x.title));
            list.appendChild(b);
          });
        } catch (e) {
          list.innerHTML =
            '<div class="state error">' +
            (e.response?.data?.message ||
              "We could not load the boards. Please try again.") +
            "</div>";
        }
      }
      loadOrganisationSelector();
      load();
    </script>
  </body>
</html>
